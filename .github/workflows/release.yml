name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  OWNER_REPO: Plasticine-Yang/traex-session-manager

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository and version tag
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$OWNER_REPO"
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "$GITHUB_REF_NAME" = "v$version"

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --locked --release --target "${{ matrix.target }}"
      - name: Verify static Linux binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          output=$(ldd "target/${{ matrix.target }}/release/tsm" 2>&1 || true)
          echo "$output"
          grep -Eq 'not a dynamic executable|statically linked' <<<"$output"
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          package="tsm-$version-${{ matrix.target }}"
          mkdir "$package"
          cp "target/${{ matrix.target }}/release/tsm" LICENSE README.md "$package/"
          tar -C "$package" -czf "$package.tar.gz" tsm LICENSE README.md
      - uses: actions/upload-artifact@v4
        with:
          name: tsm-${{ matrix.target }}
          path: tsm-*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum tsm-*.tar.gz > SHA256SUMS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$OWNER_REPO" --generate-notes
